function teamLogo(team, size){
  size = Number(size) || 26;
  const cls = 'tlogo' + (size >= 38 ? ' lg' : (size <= 20 ? ' sm' : ''));
  const color = (team && team.color) || 'var(--dim)';
  const name  = (team && team.name) || '';
  const logo  = (team && team.logo) ? String(team.logo).trim() : '';
  const style = `width:${size}px;height:${size}px;border-color:${esc(color)};font-size:${Math.round(size * 0.56)}px;`;
  if (logo && isImageUrl(logo)) return `<span class="${cls}" style="${style}"><img src="${esc(logo)}" alt="${esc(name)}" loading="lazy"></span>`;
  if (logo) return `<span class="${cls}" style="${style}color:${esc(color)}">${esc(logo)}</span>`;

  return `<span class="${cls}" style="${style}color:${esc(color)}">${letter ? esc(letter) : '🛡️'}</span>`;
}

  const L = Math.exp(-Math.max(0.05, lambda));
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);

}

function hydrate(raw){
  const d = defaultState();
  const s = Object.assign({}, d, raw || {});
  s.settings = Object.assign({}, d.settings, (raw && raw.settings) || {});
  const re = (raw && raw.settings && raw.settings.economy) || {};
  s.settings.economy = Object.assign({}, d.settings.economy, re);
  s.settings.economy.enabled = Object.assign({}, d.settings.economy.enabled, re.enabled || {});
  const rg = (raw && raw.settings && raw.settings.grading) || {};
  s.settings.grading = {};
  ['S','A','B'].forEach(k => s.settings.grading[k] = Object.assign({}, d.settings.grading[k], rg[k] || {}));
  const rh = (raw && raw.settings && raw.settings.hype) || {};
  s.settings.hype = Object.assign({}, d.settings.hype, rh);
  const rb = (raw && raw.settings && raw.settings.ballondor) || {};
  s.settings.ballondor = Object.assign({}, d.settings.ballondor, rb);
  if ((Number(rb._formulaVersion) || 0) < 2){
    /* The former formula used different team and One Man Army weights.
       Install the user's new Ballon d'Or table once; admins can edit it afterwards. */
    Object.assign(s.settings.ballondor, BALLONDOR_DEFAULT);
    s._needsBallonFormulaPersist = true;
  }
  /* Keep old league saves on a stable Hype cycle until the next season reset. */
  if (!s.hypeCycleId){
    const seed = String(s.seasonName || 'current-season').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 48) || 'current-season';
    s.hypeCycleId = 'legacy_' + seed;
  }
  if (raw && !raw.hypeCycleId) s._needsHypeCyclePersist = true;
  if (!Array.isArray(s.settings.disabledAwards)) s.settings.disabledAwards = [];
  ['teams','players','matches','fixtures','tournaments','archives','logs','guide'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}

/* Migration: backfill playerTeams on matches, convert retired → freeAgent */
function migrate(){
  let changed = false;
  if (app.state._needsHypeCyclePersist){
    delete app.state._needsHypeCyclePersist;
    changed = true;
  }
  if (app.state._needsBallonFormulaPersist){
    delete app.state._needsBallonFormulaPersist;
    changed = true;
  }

  /* retired → freeAgent */
  app.state.players.forEach(p => {
    if (p.retired){
      p.freeAgent = true;
      delete p.retired;
      delete p.retiredAt;
      changed = true;
    }
    if (p.freeAgent === undefined){ p.freeAgent = false; changed = true; }

    /* Older loans were charged up front. Preserve that payment, but track
       future participation so they can now be ended early without losing stats. */
    if (p.loanStatus && p.loanStatus.legsTotal === undefined){
      const oldLoan = p.loanStatus;
      const remaining = Math.max(1, Number(oldLoan.legsRemaining) || 1);
      const history = p.transferHistory || [];
      const latestLoan = history.slice().reverse().find(h => h.type === 'loan');
      oldLoan.to = oldLoan.to || p.teamId;
      oldLoan.legsTotal = remaining;
      oldLoan.legsPlayed = 0;
      oldLoan.legsRemaining = remaining;
      oldLoan.feeTotal = Number(oldLoan.fee) || 0;
      oldLoan.paid = Number(oldLoan.fee) || 0;
      oldLoan.legacyPrepaid = true;
      oldLoan.startedAt = oldLoan.startedAt || (latestLoan && latestLoan.ts) || Date.now();
      oldLoan.processedMatchIds = Array.isArray(oldLoan.processedMatchIds) ? oldLoan.processedMatchIds : [];
      changed = true;
    }
  });

  /* backfill playerTeams on matches */
  app.state.matches.forEach(m => {
    if (m.playerTeams) return;
    m.playerTeams = {};
    const A = m.teamAId, B = m.teamBId;
    Object.keys(m.playerStats || {}).forEach(pid => {
      const p = playerById(pid);
      if (!p) return;
      if (p.teamId === A || p.teamId === B) { m.playerTeams[pid] = p.teamId; return; }
      /* player has moved since; use earliest matching history */
      const hist = (p.transferHistory || []);
      for (const h of hist){
        if (h.from === A || h.from === B) { m.playerTeams[pid] = h.from; return; }
        if (h.to === A || h.to === B) { m.playerTeams[pid] = h.to; return; }
      }
      m.playerTeams[pid] = A;
    });
    changed = true;
  });

  return changed;
}

function currentHypeCycleId(){
  return (app.state && app.state.hypeCycleId) || 'legacy_current-season';
}
function hypeCounterId(playerId, cycleId){
  return String(cycleId || currentHypeCycleId()) + '_' + String(playerId);
}
function hypeVoteId(playerId, uid, cycleId){
  return hypeCounterId(playerId, cycleId) + '_' + String(uid);
}
function rebuildHypeCountMap(){
  const cycleId = currentHypeCycleId();
  const counts = {};
  Object.keys(app._hypeDocs || {}).forEach(docId => {
    const d = app._hypeDocs[docId] || {};
    if (d.cycleId === cycleId && d.playerId) counts[d.playerId] = Math.max(0, Number(d.count) || 0);
  });
  app._hypeCounts = counts;
}
function getHypeCount(playerId){
  return Math.max(0, Number((app._hypeCounts || {})[playerId]) || 0);
}
function syncHypeButton(playerId, alreadyVoted){
  if (app._activePlayerProfileId !== playerId) return;
  const button = $('#playerHypeButton');
  if (!button) return;
  /* Visitors are silently assigned a Firebase anonymous identity behind the scenes. */
  const enabled = !!(firebaseReady && app.db && app._hypeReady);
  button.disabled = !!alreadyVoted || !enabled;
  button.textContent = alreadyVoted ? '🔥 Already Hyped' : (enabled ? '🔥 Hype this player' : '🔥 Connecting…');
  const count = $('#playerHypeCount');
  if (count) count.textContent = num(getHypeCount(playerId));
}
async function ensureHypeFanIdentity(){
  if (app.user && app.user.uid) return app.user;
  if (!firebaseReady || !app.auth) throw new Error('Hype is temporarily unavailable.');
  if (!app._hypeAuthPromise){
    app._hypeAuthRequested = true;
    app._hypeAuthPromise = app.auth.signInAnonymously().then(credential => {
      app.user = credential.user;
      app.isAdmin = false;
      return credential.user;
    }).finally(() => {
      app._hypeAuthRequested = false;
      app._hypeAuthPromise = null;
    });
  }
  return app._hypeAuthPromise;
}

async function refreshPlayerHypeVoteStatus(playerId){
  if (!firebaseReady || !app.db || !app.user || !app.user.uid) return;
  const uid = app.user.uid;
  const voteId = hypeVoteId(playerId, uid);
  try {
    const snap = await app.db.collection('hype_votes').doc(voteId).get();
    app._hypedPlayerIds[playerId] = snap.exists;
    syncHypeButton(playerId, snap.exists);
  } catch(e){
    console.warn('Could not read Hype vote status', e);
  }
}
async function castPlayerHype(playerId){
  if (!playerById(playerId)) return toast('⚠️ Player not found', 'err');
  if (!firebaseReady || !app.db) return toast('🔥 Hype is temporarily unavailable. Please try again later.', 'err');
  if (!app._hypeReady) return toast('⏳ Connecting to the fanbase… try again in a moment.', 'err');

  let fan;
  try { fan = await ensureHypeFanIdentity(); }
  catch(e){
    console.warn('Silent fan identity could not be created', e);
    return toast('🔥 Hype is temporarily unavailable. Please try again later.', 'err');
  }
  const uid = fan.uid;
  const cycleId = currentHypeCycleId();
  const counterId = hypeCounterId(playerId, cycleId);
  const counterRef = app.db.collection('hype_counts').doc(counterId);
  const voteRef = app.db.collection('hype_votes').doc(hypeVoteId(playerId, uid, cycleId));

  try {
    const result = await app.db.runTransaction(async tx => {
      const voteSnap = await tx.get(voteRef);
      if (voteSnap.exists) return { already: true, count: getHypeCount(playerId) };
      const countSnap = await tx.get(counterRef);
      const nextCount = (countSnap.exists ? Math.max(0, Number(countSnap.data().count) || 0) : 0) + 1;
      const serverTime = firebase.firestore.FieldValue.serverTimestamp();
      tx.set(voteRef, { cycleId, playerId, uid, createdAt: serverTime });
      tx.set(counterRef, { cycleId, playerId, count: nextCount, updatedAt: serverTime });
      return { already: false, count: nextCount };
    });

    if (result.already){
      app._hypedPlayerIds[playerId] = true;
      syncHypeButton(playerId, true);
      return toast('🔥 You have already hyped this player this season on this browser.', 'err');
    }

    app._hypedPlayerIds[playerId] = true;
    app._hypeDocs[counterId] = { cycleId, playerId, count: result.count };
    rebuildHypeCountMap();
    if (app._activePlayerProfileId === playerId) openPlayerProfile(playerId);
    else render();
    const perHype = Math.max(0, Number((app.state.settings.hype || HYPE_DEFAULT).valuePerHype) || 0);
    toast(`🔥 ${esc(playerById(playerId).name)} got a Hype! +${money(perHype)} value and +${Number((app.state.settings.ballondor || BALLONDOR_DEFAULT).hype) || 0} Ballon d'Or point.`, 'ok');
  } catch(e){
    console.error('Hype vote failed', e);
    const reason = e.code === 'permission-denied'
      ? 'The public voting service is not configured correctly. Please tell the site admin.'
      : (e.message || e.code || 'Unknown error');
    toast('❌ Hype could not be saved: ' + esc(reason), 'err');
  }
}

function loadLocal(){
  if (ARCHIVE_MODE){
    app.state = hydrate(ARCHIVE.state);
    app.state.logs = [];
    migrate();
    app._cloudLoaded = true;
    app._hypeDocs = JSON.parse(JSON.stringify(ARCHIVE.hypeDocs || {}));
    app._hypeReady = false;
    rebuildHypeCountMap();
    return;
  }
  try {
    const raw = localStorage.getItem(LS_KEY);
    app.state = hydrate(raw ? JSON.parse(raw) : null);
    const lg = localStorage.getItem(LS_LOGS);
    app.state.logs = lg ? JSON.parse(lg) : (app.state.logs || []);
    if (migrate()){
      try { localStorage.setItem(LS_KEY, JSON.stringify(app.state)); } catch(e){}
    }
  } catch(e){
    console.warn('localStorage load failed', e);
    app.state = hydrate(null);
  }
}

async function saveState(opts){
  if (ARCHIVE_MODE) return;
  opts = opts || {};
  if (firebaseReady && app.db && !app._cloudLoaded && !opts.force){
    toast('⏳ Still loading the cloud save, wait a second and try again', 'err');
    return;
  }
  if (!opts.silent) app._suppress = true;
  try { localStorage.setItem(LS_KEY, JSON.stringify(app.state)); } catch(e){ console.warn('LS save failed', e); }
  try { localStorage.setItem(LS_LOGS, JSON.stringify(app.state.logs.slice(-200))); } catch(e){}
  if (firebaseReady && app.db){
    try {
      await app.db.doc(DOC_PATH).set(JSON.parse(JSON.stringify(app.state)));
    } catch(e){
      console.warn('Firestore save failed', e);
      const why = e.code === 'permission-denied'
        ? 'Firestore rules blocked the write. Are you logged in as the admin email?'
        : e.code === 'invalid-argument' || /too large/i.test(e.message || '')
          ? 'The league document is too big for Firestore (1 MB limit).'
          : (e.code || e.message);
      toast('☁️ Cloud save failed, saved locally only: ' + why, 'err');
    }
  }
  setTimeout(() => { app._suppress = false; }, 400);
}

async function logAdmin(action, before, after){
  if (ARCHIVE_MODE) return;
  const entry = { ts: Date.now(), email: (app.user && app.user.email) || 'local-admin', action,
    before: before === undefined ? null : before, after: after === undefined ? null : after };
  app.state.logs.push(entry);
  if (app.state.logs.length > 200) app.state.logs = app.state.logs.slice(-200);
  try { localStorage.setItem(LS_LOGS, JSON.stringify(app.state.logs)); } catch(e){}
  if (firebaseReady && app.db){
    try { await app.db.collection(LOGS_COL).add(entry); } catch(e){ console.warn('log write failed', e); }
  }
}

function initFirebase(){
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    app.db = firebase.firestore();
    app.auth = firebase.auth();
    $('#cloudBadge').textContent = 'CLOUD';
    $('#cloudBadge').className = 'cloud-badge on';

    app.db.doc(DOC_PATH).onSnapshot(snap => {
      const firstCloudSnapshot = !app._cloudLoaded;
      app._cloudLoaded = true;
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (!snap.exists){
        app.state = hydrate(null);
        render();
        return;
      }
      if (app._suppress) return;
      app.state = hydrate(snap.data());
      if (migrate()) saveState({ silent:true, force:true });
      if (firstCloudSnapshot && location.hash) applyHashRoute();
      else render();
    }, err => {
      console.warn('snapshot error', err);
      app._cloudError = err.code || err.message || 'Cloud database unavailable';
      app._cloudLoaded = true;
      render();
      toast('☁️ Could not read the cloud save: ' + app._cloudError, 'err');
    });

    /* Public Hype totals live in their own collection, separate from the admin-only league document. */
    app.db.collection('hype_counts').onSnapshot(snap => {
      const docs = {};
      snap.forEach(doc => docs[doc.id] = doc.data() || {});
      app._hypeDocs = docs;
      app._hypeReady = true;
      app._hypeError = null;
      rebuildHypeCountMap();
      render();
    }, err => {
      console.warn('Hype counter listener error', err);
      app._hypeReady = false;
      app._hypeError = err.code || err.message || 'Hype counters unavailable';
      render();
    });

    app.auth.onAuthStateChanged(async u => {
      const previousUid = app.user && app.user.uid;
      app.user = u;
      if (previousUid !== (u && u.uid)) app._hypedPlayerIds = {};
      if (!u){
        app.isAdmin = false;
        if (!app._hypeAuthRequested && !app._hypeAuthPromise){
          ensureHypeFanIdentity().catch(err => {
            console.warn('Silent public Hype identity is unavailable', err);
            app._hypeError = err.code || err.message || 'Hype temporarily unavailable';
            render();
          });
        }
      } else {
        app._hypeAuthRequested = false;
        let claim = false;
        try { const t = await u.getIdTokenResult(); claim = t.claims && t.claims.admin === true; } catch(e){}
        app.isAdmin = ADMIN_EMAILS.includes(u.email) || claim;
        if (!u.isAnonymous && !app.isAdmin) toast('⚠️ Signed in, but this email is not in ADMIN_EMAILS', 'err');
        if (app._activePlayerProfileId) refreshPlayerHypeVoteStatus(app._activePlayerProfileId);
      }
      render();
    });
  } catch(e){
    console.warn('Firebase init failed, local mode', e);
    // Fall back completely to local mode. Leaving firebaseReady true here
    // incorrectly disabled local-admin login after SDK/network initialization errors.
    firebaseReady = false;
    app.firebaseReady = false;
    app.db = null;
    app.auth = null;
    app._cloudLoaded = true;
    app._cloudError = null;
    $('#cloudBadge').textContent = 'LOCAL';
    $('#cloudBadge').className = 'cloud-badge off';
  }
}

const teamById   = id => app.state.teams.find(t => t.id === id) || { id, name:'Unknown', color:'#666', value:0, stats:{} };
const playerById = id => app.state.players.find(p => p.id === id);
const fixtureById= id => app.state.fixtures.find(f => f.id === id);
const tourById   = id => app.state.tournaments.find(t => t.id === id);

/* A player is on an active roster if not a free agent */
const isActivePlayer = p => p && !p.freeAgent;

function matchLegs(m){
  const legs = [];
  for (let i = 1; i <= 4; i++){
    const a = m['leg'+i+'ScoreA'], b = m['leg'+i+'ScoreB'];
    if (a === null || a === undefined || a === '' || b === null || b === undefined || b === '') continue;
    legs.push({ n:i, a:Number(a), b:Number(b) });
  }
  return legs;
}
function matchFoulPenalty(m, teamId){
  return (Array.isArray(m && m.fouls) ? m.fouls : []).reduce((sum, foul) => {
    if (!foul || !String(foul.description || '').trim() || foul.teamId !== teamId) return sum;
    const points = Number(foul.points);
    return sum + (points === 2 ? 2 : points === 1 ? 1 : 0);
  }, 0);
}
function matchAggregate(m){
  const legs = matchLegs(m);
  let rawA = 0, rawB = 0;
  legs.forEach(l => { rawA += l.a; rawB += l.b; });
  const penaltyA = matchFoulPenalty(m, m.teamAId);
  const penaltyB = matchFoulPenalty(m, m.teamBId);
  /* Fouls reduce the offending team's aggregate score, never below zero. */
  const a = Math.max(0, rawA - penaltyA);
  const b = Math.max(0, rawB - penaltyB);
  return { legs, rawA, rawB, penaltyA, penaltyB, a, b, res: a > b ? 'A' : (b > a ? 'B' : 'D') };
}
function legCount(m){
  for (let i = 4; i >= 1; i--){
    const a = m['leg'+i+'ScoreA'];
    if (a !== null && a !== undefined && a !== '') return i;
  }
  return 0;
}

/* Which team did this player play for in this match? Snapshot-based. */
function teamForMatch(m, pid){
  if (m.playerTeams && m.playerTeams[pid]) return m.playerTeams[pid];
  const p = playerById(pid);
  return p ? p.teamId : null;
}

function computePlayerStats(){
  const E = econ();
  const st = {};
  const get = id => st[id] || (st[id] = {
    goals:0, assists:0, saves:0, tackles:0, legsPlayed:0, legs:0,
    mvp:0, motm:0, matches:0, growth:0, playerValue:0, marketValue:0,
    legLog: []
  });

  app.state.players.forEach(p => get(p.id));

  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    const playedSet = new Set();

    Object.keys(ps).forEach(pid => {
      if (!playerById(pid)) return;
      const legs = ps[pid];
      if (!Array.isArray(legs)) return;
      const s = get(pid);
      let playedAny = false;
      legs.forEach((lg, i) => {
        if (!lg || !lg.played) return;
        if (i >= agg.legs.length) return;
        playedAny = true;
        s.legsPlayed++;
        const g = +lg.goals || 0, a = +lg.assists || 0, sv = +lg.saves || 0, tk = +lg.tackles || 0;
        s.goals += g; s.assists += a; s.saves += sv; s.tackles += tk;
        s.legLog.push({ matchId: m.id, leg: i + 1, g, a, s: sv, t: tk });
      });
      if (playedAny) playedSet.add(pid);
    });

    playedSet.forEach(pid => get(pid).matches++);
    if (m.mvpId && playerById(m.mvpId))  get(m.mvpId).mvp++;
    if (m.motmId && playerById(m.motmId)) get(m.motmId).motm++;
  });

  app.state.players.forEach(p => {
    const s = get(p.id);
    const en = E.enabled;
    let growth = 0;
    if (en.goal)   growth += s.goals   * E.goal;
    if (en.assist) growth += s.assists * E.assist;
    if (en.save)   growth += s.saves   * E.save;
    if (en.tackle) growth += s.tackles * E.tackle;
    if (en.mvp)    growth += s.mvp     * E.mvp;
    if (en.motm)   growth += s.motm    * E.motm;
    const hypeCount = getHypeCount(p.id);
    const hypeReward = Math.max(0, Number((app.state.settings.hype || HYPE_DEFAULT).valuePerHype) || 0);
    const hypeGrowth = hypeCount * hypeReward;
    growth += hypeGrowth;
    s.hypeCount = hypeCount;
    s.hypeValueBonus = hypeGrowth;
    s.growth = growth;
    const start = (p.startingValue === undefined || p.startingValue === null) ? E.playerStart : p.startingValue;
    s.startingValue = start;
    s.playerValue = Math.min(E.cap, start + growth);
    s.marketValue = s.playerValue;
  });

  return st;
}

function gradingCfg(){ return app.state.settings.grading; }

function gradeStats(goals, assists, saves, tackles){
  const C = gradingCfg();
  const clears = k => {
    const c = C[k] || {};
    const bars = [
      [+c.goals   || 0, +goals   || 0],
      [+c.assists || 0, +assists || 0],
      [+c.saves   || 0, +saves   || 0],
      [+c.tackles || 0, +tackles || 0]
    ];
    return bars.some(([need, got]) => need > 0 && got >= need);
  };
  if (clears('S')) return 'S';
  if (clears('A')) return 'A';
  if (clears('B')) return 'B';
  return 'C';
}

function legGrade(l){
  l = l || {};
  const g = (l.g !== undefined && l.g !== null) ? l.g : (l.goals || 0);
  const a = (l.a !== undefined && l.a !== null) ? l.a : (l.assists || 0);
  const s = (l.s !== undefined && l.s !== null) ? l.s : (l.saves || 0);
  const t = (l.t !== undefined && l.t !== null) ? l.t : (l.tackles || 0);
  return gradeStats(+g || 0, +a || 0, +s || 0, +t || 0);
}

function avgGrade(avg){
  avg = avg || {};
  return gradeStats(+avg.goals || 0, +avg.assists || 0, +avg.saves || 0, +avg.tackles || 0);
}

function playerAverages(st){
  const n = Math.max(1, st.legsPlayed);
  return {
    goals: st.goals / n, assists: st.assists / n,
    saves: st.saves / n, tackles: st.tackles / n,
    games: st.legsPlayed
  };
}

function computeStandings(){
  const map = {};
  app.state.teams.forEach(t => {
    map[t.id] = { id:t.id, name:t.name, color:t.color, value:t.value || 0,
      mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0,
      form:[], comebacks:0, streak:0, best:0, wall:0 };
  });

  const ms = app.state.matches.slice().sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
  ms.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const A = map[m.teamAId], B = map[m.teamBId];
    if (!A || !B) return;

    A.mp++; B.mp++;
    A.gf += agg.a; A.ga += agg.b;
    B.gf += agg.b; B.ga += agg.a;

    if (agg.res === 'A'){
      A.w++; B.l++; A.pts += 3;
      A.form.push('W'); B.form.push('L');
      A.streak++; B.streak = 0;
      if (A.streak > A.best) A.best = A.streak;
      const l1 = agg.legs[0];
      if (l1 && l1.a <= l1.b) A.comebacks++;
    } else if (agg.res === 'B'){
      B.w++; A.l++; B.pts += 3;
      B.form.push('W'); A.form.push('L');
      B.streak++; A.streak = 0;
      if (B.streak > B.best) B.best = B.streak;
      const l1 = agg.legs[0];
      if (l1 && l1.b <= l1.a) B.comebacks++;
    } else {
      A.d++; B.d++; A.pts++; B.pts++;
      A.form.push('D'); B.form.push('D');
      A.streak = 0; B.streak = 0;
    }
  });

  /* Wall — attribute to snapshot team */
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    Object.keys(ps).forEach(pid => {
      if (!playerById(pid)) return;
      const tid = teamForMatch(m, pid);
      if (!tid || !map[tid]) return;
      const legs = ps[pid];
      if (!Array.isArray(legs)) return;
      legs.forEach((lg, i) => {
        if (!lg || !lg.played || i >= agg.legs.length) return;
        map[tid].wall += (+lg.tackles||0) + (+lg.saves||0);
      });
    });
  });

  Object.values(map).forEach(r => { r.gd = r.gf - r.ga; });
  return map;
}

function standingsSorted(){
  const arr = Object.values(computeStandings());
  arr.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name));
  return arr;
}

function headToHead(teamA, teamB){
  let aGoals = 0, bGoals = 0, aWins = 0, bWins = 0, draws = 0;
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const isA = m.teamAId === teamA && m.teamBId === teamB;
    const isB = m.teamAId === teamB && m.teamBId === teamA;
    if (!isA && !isB) return;
    const ga = isA ? agg.a : agg.b;
    const gb = isA ? agg.b : agg.a;
    aGoals += ga; bGoals += gb;
    if (ga > gb) aWins++; else if (gb > ga) bWins++; else draws++;
  });
  return { aGoals, bGoals, aWins, bWins, draws };
}

function topContributorsPerLeg(){
  const out = [];
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    for (let i = 0; i < agg.legs.length; i++){
      const byTeam = {};
      Object.keys(ps).forEach(pid => {
        const p = playerById(pid);
        if (!p) return;
        const lg = (ps[pid] || [])[i];
        if (!lg || !lg.played) return;
        const tid = teamForMatch(m, pid);
        if (!tid) return;
        const score = (+lg.goals||0)*5 + (+lg.assists||0)*3 + (+lg.saves||0)*1 + (+lg.tackles||0)*0.5;
        (byTeam[tid] = byTeam[tid] || []).push({ pid, score, g:+lg.goals||0, a:+lg.assists||0 });
      });
      Object.keys(byTeam).forEach(tid => {
        byTeam[tid].sort((x,y) => y.score - x.score);
        out.push({ matchId:m.id, leg:i+1, teamId:tid, players: byTeam[tid] });
      });
    }
  });
  return out;
}

function oneManArmy(){
  const counts = {};
  topContributorsPerLeg().forEach(entry => {
    if (!entry.players.length) return;
    const top = entry.players[0];
    if (top.score <= 0) return;
    counts[top.pid] = (counts[top.pid] || 0) + 1;
  });
  return counts;
}

function bestDuo(){
  const pairs = new Map();
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    for (let i = 0; i < agg.legs.length; i++){
      const players = Object.keys(ps).map(pid => {
        const lg = (ps[pid] || [])[i];
        if (!lg || !lg.played || !playerById(pid)) return null;
        const teamId = teamForMatch(m, pid);
        if (!teamId) return null;
        return { pid, teamId, g: Math.max(0, +lg.goals||0), a: Math.max(0, +lg.assists||0) };
      }).filter(Boolean);
      for (let x = 0; x < players.length; x++){
        for (let y = x + 1; y < players.length; y++){
          const a = players[x], b = players[y];
          if (a.teamId !== b.teamId) continue;
          const key = [a.pid,b.pid].sort().join('|');
          const p1 = playerById(a.pid), p2 = playerById(b.pid);
          if (!p1 || !p2) continue;
          const aToB = Math.min(a.g, b.a);
          const bToA = Math.min(b.g, a.a);
          const sharedGoals = aToB + bToA;
          if (!pairs.has(key)){
            pairs.set(key, {
              a: a.pid < b.pid ? a : b,
              b: a.pid < b.pid ? b : a,
              teamId: a.teamId,
              total: 0,
              aToB: 0,
              bToA: 0,
              sharedLegs: 0
            });
          }
          const pair = pairs.get(key);
          pair.total += sharedGoals;
          pair.aToB += a.pid < b.pid ? aToB : bToA;
          pair.bToA += a.pid < b.pid ? bToA : aToB;
          if (sharedGoals > 0) pair.sharedLegs++;
        }
      }
    }
  });
  return Array.from(pairs.values())
    .filter(pair => pair.total > 0)
    .map(pair => {
      const p1 = playerById(pair.a.pid), p2 = playerById(pair.b.pid);
      return {
        ...pair,
        label: p1 && p2 ? `${p1.name} & ${p2.name}` : 'Unknown Duo',
        sub: pair.total + ' shared goals • ' + pair.sharedLegs + ' productive legs'
      };
    })
    .sort((a,b) => b.total - a.total || b.sharedLegs - a.sharedLegs );
}

function teamGoalDistribution(){
  const dist = {};
  app.state.teams.forEach(t => dist[t.id] = { total: 0, top: 0, topName: '-' });
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    Object.keys(ps).forEach(pid => {
      const p = playerById(pid);
      if (!p) return;
      const tid = teamForMatch(m, pid);
      if (!tid || !dist[tid]) return;
      const legs = ps[pid];
      if (!Array.isArray(legs)) return;
      legs.forEach((l, i) => {
        if (!l || !l.played || i >= agg.legs.length) return;
        const goals = +l.goals || 0;
        dist[tid].total += goals;
        if (goals > dist[tid].top){
          dist[tid].top = goals;
          dist[tid].topName = p.name;
        }
      });
    });
  });
  return dist;
}

function ballonDor(){
  const st = computePlayerStats();
  const R = Object.assign({}, BALLONDOR_DEFAULT, app.state.settings.ballondor || {});
  const table = standingsSorted();
  const rankOf = {};
  table.forEach((r, i) => rankOf[r.id] = i + 1);

  /* If several players share a category lead, all tied leaders receive the bonus. */
  const leaders = key => {
    const entries = Object.keys(st).filter(pid => playerById(pid));
    const maximum = entries.reduce((m, pid) => Math.max(m, Number(st[pid][key]) || 0), 0);
    if (maximum <= 0) return new Set();
    return new Set(entries.filter(pid => (Number(st[pid][key]) || 0) === maximum));
  };
  const bootIds = leaders('goals');
  const playIds = leaders('assists');
  const gloveIds = leaders('saves');
  const defenderIds = leaders('tackles');
  const oma = oneManArmy();
  const omaMaximum = Object.keys(oma).reduce((m, pid) => Math.max(m, Number(oma[pid]) || 0), 0);
  const omaLeaders = new Set(omaMaximum > 0
    ? Object.keys(oma).filter(pid => (Number(oma[pid]) || 0) === omaMaximum)
    : []);

  const teamBonusForRank = rank => {
    if (rank === 1) return Number(R.teamRank1) || 0;
    if (rank === 2) return Number(R.teamRank2) || 0;
    if (rank === 3) return Number(R.teamRank3) || 0;
    return 0;
  };

  const rows = app.state.players.map(p => {
    const s = st[p.id] || {};
    const rank = rankOf[p.teamId] || (app.state.teams.length + 1);
    const teamBonus = teamBonusForRank(rank);
    const pts =
      (s.goals || 0) * Number(R.goals) +
      (s.assists || 0) * Number(R.assists) +
      (s.saves || 0) * Number(R.saves) +
      (s.tackles || 0) * Number(R.tackles) +
      ((s.mvp || 0) + (s.motm || 0)) * Number(R.mvpMotm) +
      teamBonus +
      (bootIds.has(p.id) ? Number(R.topScorerBonus) : 0) +
      (playIds.has(p.id) ? Number(R.topPlaymakerBonus) : 0) +
      (gloveIds.has(p.id) ? Number(R.topSavesBonus) : 0) +
      (defenderIds.has(p.id) ? Number(R.topTacklesBonus) : 0) +
      (omaLeaders.has(p.id) ? Number(R.oneManArmy) : 0) +
      (getHypeCount(p.id) * Number(R.hype));
    return { player: p, pts, s, rank, teamBonus, hypeCount: getHypeCount(p.id) };
  });
  rows.sort((a,b) => b.pts - a.pts || a.player.name.localeCompare(b.player.name));
  return rows;
}

function teamStrength(teamId){
  const ps = app.state.players.filter(p => p.teamId === teamId && isActivePlayer(p));
  if (!ps.length) return 1;
  const st = computePlayerStats();
  const vals = ps.map(p => st[p.id] ? st[p.id].playerValue : econ().playerStart);
  const avg = vals.reduce((a,b) => a + b, 0) / vals.length;
  const treasury = Math.max(0, teamById(teamId).value || 0);
  return Math.max(0.4, (avg / 1e6) * 0.6 + (treasury / 1e8) * 0.4);
}

function pickWeighted(list, weightFn){
  let total = 0;
  list.forEach(x => total += Math.max(0.0001, weightFn(x)));
  let r = Math.random() * total;
  for (const x of list){
    r -= Math.max(0.0001, weightFn(x));
    if (r <= 0) return x;
  }
  return list[list.length - 1];
}

function simulateTeamLeg(teamId, goals, conceded, legIndex){
  const roster = app.state.players.filter(p => p.teamId === teamId && isActivePlayer(p));
  const st = computePlayerStats();
  const out = {};
  if (!roster.length) return out;
  const w = p => (st[p.id] ? st[p.id].playerValue : 1e6);

  roster.forEach(p => {
    out[p.id] = { played: true, goals:0, assists:0, saves:0, tackles:0 };
  });

  for (let i = 0; i < goals; i++){
    const scorer = pickWeighted(roster, w);
    out[scorer.id].goals++;
    if (Math.random() < 0.68){
      const others = roster.filter(p => p.id !== scorer.id);
      if (others.length) out[pickWeighted(others, w).id].assists++;
    }
  }

  roster.forEach(p => {
    const s = st[p.id];
    const defensiveBias = s ? (s.tackles + 1) / (s.goals + s.assists + 1) : 1;
    out[p.id].tackles = Math.round(Math.random() * 4 * clamp(defensiveBias, 0.4, 2));
    out[p.id].saves   = Math.round(Math.random() * (conceded > 0 ? 5 : 3) * clamp(defensiveBias, 0.4, 2));
  });

  roster.forEach(p => { if (Math.random() < 0.12) out[p.id].played = false; });
  return out;
}

function simulateFixture(fixtureId){
  const f = fixtureById(fixtureId);
  if (!f) return null;

  const legs = f.legs || 1;
  const sA = teamStrength(f.teamAId);
  const sB = teamStrength(f.teamBId);
  const total = sA + sB || 1;
  const expA = 3.1 * (sA / total);
  const expB = 3.1 * (sB / total);

  const m = {
    id: uuid(),
    teamAId: f.teamAId, teamBId: f.teamBId, fixtureId: f.id,
    timestamp: Date.now(),
    mvpId: null, motmId: null, mvpSnapshot: null, motmSnapshot: null,
    playerStats: {}, playerTeams: {}
  };

  for (let i = 1; i <= legs; i++){
    const ga = poisson(expA * (1 + (Math.random() - 0.5) * 0.3));
    const gb = poisson(expB * (1 + (Math.random() - 0.5) * 0.3));
    m['leg'+i+'ScoreA'] = ga;
    m['leg'+i+'ScoreB'] = gb;

    const statsA = simulateTeamLeg(f.teamAId, ga, gb, i);
    const statsB = simulateTeamLeg(f.teamBId, gb, ga, i);

    Object.keys(statsA).forEach(pid => {
      m.playerStats[pid] = m.playerStats[pid] || [];
      while (m.playerStats[pid].length < i) m.playerStats[pid].push({ played:false, goals:0, assists:0, saves:0, tackles:0 });
      m.playerStats[pid][i-1] = statsA[pid];
      m.playerTeams[pid] = f.teamAId;
    });
    Object.keys(statsB).forEach(pid => {
      m.playerStats[pid] = m.playerStats[pid] || [];
      while (m.playerStats[pid].length < i) m.playerStats[pid].push({ played:false, goals:0, assists:0, saves:0, tackles:0 });
      m.playerStats[pid][i-1] = statsB[pid];
      m.playerTeams[pid] = f.teamBId;
    });
  }
  for (let i = legs + 1; i <= 4; i++){ m['leg'+i+'ScoreA'] = null; m['leg'+i+'ScoreB'] = null; }

  const contrib = pid => {
    const legsArr = m.playerStats[pid] || [];
    let s = 0;
    legsArr.forEach(l => { if (l && l.played) s += (l.goals||0)*5 + (l.assists||0)*3 + (l.saves||0) + (l.tackles||0)*0.5; });
    return s;
  };

  const sideA = app.state.players.filter(p => p.teamId === f.teamAId && m.playerStats[p.id]);
  const sideB = app.state.players.filter(p => p.teamId === f.teamBId && m.playerStats[p.id]);
  const allPlayers = sideA.concat(sideB).sort((a,b) => contrib(b.id) - contrib(a.id));

  m.mvpId = allPlayers[0]?.id || null;
  m.motmId = allPlayers[1]?.id || allPlayers[0]?.id || null;

  if (m.mvpId){ const p = playerById(m.mvpId); m.mvpSnapshot = p ? { name:p.name, teamId:p.teamId } : null; }
  if (m.motmId){ const p = playerById(m.motmId); m.motmSnapshot = p ? { name:p.name, teamId:p.teamId } : null; }

  applyMatchToState(m, f);
  return m;
}

function cloneLoanStatus(status){
  return status ? JSON.parse(JSON.stringify(status)) : null;
}

function returnPlayerFromLoan(p, reason, matchId){
  if (!p || !p.loanStatus) return null;
  const loan = p.loanStatus;
  const borrowerTeamId = loan.to || p.teamId;
  const ownerTeamId = loan.from;
  const returnTeamExists = app.state.teams.some(t => t.id === ownerTeamId);
  const paid = Number(loan.paid !== undefined ? loan.paid : loan.fee) || 0;
  const legsPlayed = Number(loan.legsPlayed) || 0;

  if (returnTeamExists) p.teamId = ownerTeamId;
  p.loanStatus = null;
  p.transferHistory = p.transferHistory || [];
  p.transferHistory.push({
    type: 'loan-return', from: borrowerTeamId, to: p.teamId,
    value: paid, legsPlayed, reason: reason || 'manual',
    matchId: matchId || null, ts: Date.now()
  });
  return { borrowerTeamId, ownerTeamId, paid, legsPlayed, returnedTo: p.teamId };
}

function applyLoanLegsForMatch(m){
  const agg = matchAggregate(m);
  if (!agg.legs.length) return;
  const matchId = String(m.id || '');
  if (!matchId) return;
  m.loanSettlements = [];

  app.state.players.forEach(p => {
    const loan = p.loanStatus;
    if (!loan) return;
    const borrowerTeamId = loan.to || p.teamId;
    if (borrowerTeamId !== m.teamAId && borrowerTeamId !== m.teamBId) return;
    const snapshotTeam = (m.playerTeams && m.playerTeams[p.id]) || p.teamId;
    if (snapshotTeam !== borrowerTeamId) return;
    if (loan.startedAt && m.timestamp && Number(m.timestamp) < Number(loan.startedAt)) return;

    loan.processedMatchIds = Array.isArray(loan.processedMatchIds) ? loan.processedMatchIds : [];
    if (loan.processedMatchIds.includes(matchId)) return;

    const loanBefore = cloneLoanStatus(loan);
    const playedLegs = agg.legs.filter(l => {
      const playerLeg = (m.playerStats && m.playerStats[p.id] || [])[l.n - 1];
      return !!(playerLeg && playerLeg.played);
    });
    const totalLegs = Math.max(1, Number(loan.legsTotal) || Number(loan.legsRemaining) || 1);
    const alreadyPlayed = Math.max(0, Number(loan.legsPlayed) || 0);
    const ownerTeam = app.state.teams.find(t => t.id === loan.from);
    const borrowerTeam = app.state.teams.find(t => t.id === borrowerTeamId);
    let charged = 0;
    let processedPlayed = 0;

    playedLegs.forEach(() => {
      if (alreadyPlayed + processedPlayed >= totalLegs) return;
      processedPlayed++;
      const nextPlayed = alreadyPlayed + processedPlayed;
      if (!loan.legacyPrepaid){
        const feeTotal = Math.max(0, Number(loan.feeTotal !== undefined ? loan.feeTotal : loan.fee) || 0);
        const wasPaid = Math.max(0, Number(loan.paid) || 0);
        const targetPaid = nextPlayed >= totalLegs ? feeTotal : Math.round(feeTotal * nextPlayed / totalLegs);
        const legCharge = Math.max(0, targetPaid - wasPaid);
        if (legCharge){
          if (borrowerTeam) borrowerTeam.value -= legCharge;
          if (ownerTeam) ownerTeam.value += legCharge;
          charged += legCharge;
        }
        loan.paid = targetPaid;
      }
      loan.legsPlayed = nextPlayed;
    });

    loan.legsRemaining = Math.max(0, totalLegs - (Number(loan.legsPlayed) || 0));
    loan.processedMatchIds.push(matchId);
    const settlement = {
      playerId: p.id, loanStartedAt: loan.startedAt || null, matchId,
      ownerTeamId: loan.from, borrowerTeamId,
      loanStatusBefore: loanBefore, playedLegs: processedPlayed,
      charged, autoReturned: false
    };
    if ((Number(loan.legsPlayed) || 0) >= totalLegs){
      returnPlayerFromLoan(p, 'completed', matchId);
      settlement.autoReturned = true;
    }
    m.loanSettlements.push(settlement);
  });
}

function revertLoanSettlements(m){
  if (!m || !Array.isArray(m.loanSettlements) || !m.loanSettlements.length) return;
  const matchId = String(m.id || '');
  m.loanSettlements.forEach(settlement => {
    const p = playerById(settlement.playerId);
    let restoredFromAutoReturn = false;
    if (p && settlement.autoReturned){
      const history = p.transferHistory || [];
      const returnIndex = history.findIndex(h => h.type === 'loan-return' && String(h.matchId || '') === matchId);
      if (returnIndex >= 0){
        history.splice(returnIndex, 1);
        p.teamId = settlement.borrowerTeamId;
        p.loanStatus = cloneLoanStatus(settlement.loanStatusBefore);
        restoredFromAutoReturn = true;
      }
    }
    if (p && !restoredFromAutoReturn && p.loanStatus){
      const sameLoan = settlement.loanStartedAt
        ? p.loanStatus.startedAt === settlement.loanStartedAt
        : (p.loanStatus.from === settlement.ownerTeamId && (p.loanStatus.to || p.teamId) === settlement.borrowerTeamId);
      if (sameLoan){
        p.loanStatus.legsPlayed = Math.max(0, (Number(p.loanStatus.legsPlayed) || 0) - (Number(settlement.playedLegs) || 0));
        const total = Math.max(1, Number(p.loanStatus.legsTotal) || 1);
        p.loanStatus.legsRemaining = Math.max(0, total - p.loanStatus.legsPlayed);
        p.loanStatus.paid = Math.max(0, (Number(p.loanStatus.paid) || 0) - (Number(settlement.charged) || 0));
        p.loanStatus.processedMatchIds = (p.loanStatus.processedMatchIds || []).filter(x => String(x) !== matchId);
      }
    }
    const borrower = app.state.teams.find(t => t.id === settlement.borrowerTeamId);
    const owner = app.state.teams.find(t => t.id === settlement.ownerTeamId);
    const charged = Number(settlement.charged) || 0;
    if (charged){ if (borrower) borrower.value += charged; if (owner) owner.value -= charged; }
  });
  m.loanSettlements = [];
}

function applyMatchToState(m, fixture){
  if (!m.playerTeams){
    m.playerTeams = {};
    Object.keys(m.playerStats || {}).forEach(pid => {
      const p = playerById(pid);
      if (p && p.teamId) m.playerTeams[pid] = p.teamId;
    });
  }

  const E = econ();
  const agg = matchAggregate(m);
  const A = app.state.teams.find(t => t.id === m.teamAId);
  const B = app.state.teams.find(t => t.id === m.teamBId);

  if (A && B){
    if (agg.res === 'A'){
      if (E.enabled.win)  A.value += E.win;
      if (E.enabled.loss) B.value += E.loss;
    } else if (agg.res === 'B'){
      if (E.enabled.win)  B.value += E.win;
      if (E.enabled.loss) A.value += E.loss;
    } else {
      if (E.enabled.draw){ A.value += E.draw; B.value += E.draw; }
    }
  }

  app.state.matches.push(m);

  if (fixture){ fixture.played = true; fixture.matchId = m.id; }

  /* Loan duration and billing advance only for legs this loanee actually played. */
  applyLoanLegsForMatch(m);

  if (fixture && fixture.tournamentId) progressTournament(fixture.tournamentId);
}

function createTournament(name, teamIds, groupCount, koLegs){
  const t = {
    id: uuid(), name: name || 'Cup', format: 'Groups + Knockout',
    teams: teamIds.slice(), groups: [], groupCount, koLegs: koLegs || 1,
    phase: 'group', started: Date.now(), completed: false, winner: null, created: Date.now(), ko: null
  };

  const buckets = Array.from({ length: groupCount }, () => []);
  teamIds.forEach((id, i) => {
    const round = Math.floor(i / groupCount);
    const idx = round % 2 === 0 ? (i % groupCount) : (groupCount - 1 - (i % groupCount));
    buckets[idx].push(id);
  });
  t.groups = buckets;
  app.state.tournaments.push(t);

  t.groups.forEach((g, gi) => {
    for (let i = 0; i < g.length; i++){
      for (let j = i + 1; j < g.length; j++){
        for (let leg = 1; leg <= 2; leg++){
          app.state.fixtures.push({
            id: uuid(),
            teamAId: leg === 1 ? g[i] : g[j],
            teamBId: leg === 1 ? g[j] : g[i],
            competition: 'Tournament',
            round: 'Group ' + String.fromCharCode(65 + gi),
            date: '', legs: 1, played: false, stage: 'group',
            tournamentId: t.id, group: gi
          });
        }
      }
    }
  });
  return t;
}

function groupStandings(t, gi){
  const ids = t.groups[gi] || [];
  const map = {};
  ids.forEach(id => {
    const tm = teamById(id);
    map[id] = { id, name: tm.name, color: tm.color, mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 };
  });
  const fixtures = app.state.fixtures.filter(f => f.tournamentId === t.id && f.stage === 'group' && f.group === gi);
  fixtures.forEach(f => {
    if (!f.played) return;
    const m = app.state.matches.find(x => x.id === f.matchId);
    if (!m) return;
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const A = map[m.teamAId], B = map[m.teamBId];
    if (!A || !B) return;
    A.mp++; B.mp++;
    A.gf += agg.a; A.ga += agg.b; B.gf += agg.b; B.ga += agg.a;
    if (agg.res === 'A'){ A.w++; B.l++; A.pts += 3; }
    else if (agg.res === 'B'){ B.w++; A.l++; B.pts += 3; }
    else { A.d++; B.d++; A.pts++; B.pts++; }
  });
  Object.values(map).forEach(r => r.gd = r.gf - r.ga);
  return Object.values(map).sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
}

function groupComplete(t){
  const fx = app.state.fixtures.filter(f => f.tournamentId === t.id && f.stage === 'group');
  return fx.length > 0 && fx.every(f => f.played);
}

function advanceToKnockout(tid){
  const t = tourById(tid);
  if (!t) return;
  if (!groupComplete(t)){ toast('⚠️ Group stage is not finished yet', 'err'); return; }

  const qualifiers = [];
  t.groups.forEach((g, gi) => {
    const tbl = groupStandings(t, gi);
    tbl.slice(0, 2).forEach((r, idx) => qualifiers.push({ teamId: r.id, seed: gi * 2 + idx + 1, pts: r.pts, gd: r.gd }));
  });
  qualifiers.sort((a,b) => b.pts - a.pts || b.gd - a.gd);
  qualifiers.forEach((q, i) => q.seed = i + 1);

  const qIds = qualifiers.map(q => q.teamId);
  const rounds = [];

  if (qIds.length === 4){
    rounds.push({ name:'Semi-finals', ties: [
      { a: qIds[0], b: qIds[3], winner:null, fixtureIds:[] },
      { a: qIds[1], b: qIds[2], winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Final', ties:[ { a:null, b:null, winner:null, fixtureIds:[] } ]});
  } else if (qIds.length === 6){
    rounds.push({ name:'Quarter-finals', ties: [
      { a: qIds[2], b: qIds[5], winner:null, fixtureIds:[] },
      { a: qIds[3], b: qIds[4], winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Semi-finals', ties: [
      { a: qIds[0], b:null, winner:null, fixtureIds:[] },
      { a: qIds[1], b:null, winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Final', ties:[ { a:null, b:null, winner:null, fixtureIds:[] } ]});
  } else {
    toast('⚠️ Need 4 or 6 qualifiers', 'err'); return;
  }

  t.ko = { rounds };
  t.phase = 'knockout';
  materializeKO(t);
  toast('🏁 Knockout stage generated!', 'ok');
}

function materializeKO(t){
  if (!t.ko) return;
  t.ko.rounds.forEach((round, ri) => {
    round.ties.forEach((tie, ti) => {
      if (tie.fixtureIds && tie.fixtureIds.length) return;
      if (!tie.a || !tie.b) return;
      tie.fixtureIds = [];
      const legs = t.koLegs || 1;
      for (let l = 1; l <= legs; l++){
        const f = {
          id: uuid(),
          teamAId: l % 2 === 1 ? tie.a : tie.b,
          teamBId: l % 2 === 1 ? tie.b : tie.a,
          competition: 'Tournament', round: round.name, date: '',
          legs: 1, played: false, stage: 'ko',
          tournamentId: t.id, koRound: ri, koTie: ti
        };
        app.state.fixtures.push(f);
        tie.fixtureIds.push(f.id);
      }
    });
  });
}

function progressTournament(tid){
  const t = tourById(tid);
  if (!t || !t.ko) return;

  t.ko.rounds.forEach((round, ri) => {
    round.ties.forEach((tie, ti) => {
      if (tie.winner) return;
      if (!tie.fixtureIds || !tie.fixtureIds.length) return;
      const fxs = tie.fixtureIds.map(fixtureById).filter(Boolean);
      if (!fxs.length || !fxs.every(f => f.played)) return;

      let aggA = 0, aggB = 0;
      fxs.forEach(f => {
        const m = app.state.matches.find(x => x.id === f.matchId);
        if (!m) return;
        const agg = matchAggregate(m);
        if (m.teamAId === tie.a){ aggA += agg.a; aggB += agg.b; }
        else { aggA += agg.b; aggB += agg.a; }
      });
      tie.winner = aggA >= aggB ? tie.a : tie.b;

      const next = t.ko.rounds[ri + 1];
      if (next){
        if (ri === 0 && t.ko.rounds.length === 2) {
          next.ties[0][ti === 0 ? 'a' : 'b'] = tie.winner;
        } else if (ri === 0 && t.ko.rounds.length === 3) {
          next.ties[ti].b = tie.winner;
        } else if (ri === 1 && t.ko.rounds.length === 3) {
          next.ties[0][ti === 0 ? 'a' : 'b'] = tie.winner;
        }
        materializeKO(t);
      } else {
        t.completed = true;
        t.phase = 'done';
        t.winner = tie.winner;
        toast('🏆 ' + teamById(tie.winner).name + ' wins ' + t.name + '!', 'ok');
      }
    });
  });
}

function rebuildTournamentKO(tid) {
  const t = tourById(tid);
  if (!t || !t.ko) return;
  t.ko.rounds.forEach(r => r.ties.forEach(tie => { tie.winner = null; }));
  if (t.ko.rounds.length === 2) {
    t.ko.rounds[1].ties[0].a = null;
    t.ko.rounds[1].ties[0].b = null;
  } else if (t.ko.rounds.length === 3) {
    t.ko.rounds[1].ties[0].b = null;
    t.ko.rounds[1].ties[1].b = null;
    t.ko.rounds[2].ties[0].a = null;
    t.ko.rounds[2].ties[0].b = null;
  }
  t.completed = false;
  t.phase = 'knockout';
  t.winner = null;
  progressTournament(tid);
}

function roundRobinRounds(ids){
  const list = ids.slice();
  if (list.length % 2) list.push(null);
  const n = list.length;
  const rounds = [];
  for (let r = 0; r < n - 1; r++){
    const pairs = [];
    for (let i = 0; i < n / 2; i++){
      const a = list[i], b = list[n - 1 - i];
      if (a && b) pairs.push([a, b]);
    }
    rounds.push(pairs);
    list.splice(1, 0, list.pop());
  }
  return rounds;
}

function fixtureRoundNum(f){
  const m = String((f && f.round) || '').match(/(\d+)/);
  return m ? Number(m[1]) : 9000;
}

/* Per-round ordering: uses `order` when set, else global index as fallback */
function sortedFixtures(list){
  const globalIdx = new Map(app.state.fixtures.map((f, i) => [f.id, i]));
  return list.slice().sort((a, b) => {
    const rd = fixtureRoundNum(a) - fixtureRoundNum(b);
    if (rd) return rd;
    const oa = (a.order !== undefined && a.order !== null) ? a.order : globalIdx.get(a.id);
    const ob = (b.order !== undefined && b.order !== null) ? b.order : globalIdx.get(b.id);
    if (oa !== ob) return oa - ob;
    return (globalIdx.get(a.id) || 0) - (globalIdx.get(b.id) || 0);
  });
}

/* Renumber only within a round */
function normalizeRound(roundName){
  const same = app.state.fixtures.filter(f => f.round === roundName && !f.tournamentId);
  const sorted = sortedFixtures(same);
  sorted.forEach((x, n) => { x.order = n; });
}

function moveFixture(id, dir){
  const f = fixtureById(id);
  if (!f || f.tournamentId) return false;
  const sameRound = app.state.fixtures.filter(x => x.round === f.round && !x.tournamentId);
  const sorted = sortedFixtures(sameRound);
  const i = sorted.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sorted.length) return false;
  [sorted[i], sorted[j]] = [sorted[j], sorted[i]];
  sorted.forEach((x, n) => { x.order = n; });
  return true;
}

function matchDetailDate(fixture, match){
  const value=fixture&&fixture.date;
  if(value){
    const raw=String(value),isDateOnly=raw.length===10&&raw.charAt(4)==='-'&&raw.charAt(7)==='-';
    const date=isDateOnly?new Date(raw+'T00:00:00'):new Date(raw);
    if(!Number.isNaN(date.getTime()))return date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    return raw;
  }
  if(match&&match.timestamp)return new Date(match.timestamp).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  return 'Date TBC';
}

function matchPagePlayerStats(match,teamAId,teamBId){
  if(!match)return [];
  const aggregate=matchAggregate(match),rows=[];
  Object.keys(match.playerStats||{}).forEach(pid=>{
    const teamId=teamForMatch(match,pid);
    if(teamId!==teamAId&&teamId!==teamBId)return;
    const legs=match.playerStats[pid];if(!Array.isArray(legs))return;
    const row={id:pid,player:playerById(pid),teamId:teamId,goals:0,assists:0,saves:0,tackles:0,legsPlayed:0,legStats:{}};
    legs.forEach((leg,index)=>{
      const legNumber=index+1;
      if(!leg||!leg.played||!aggregate.legs.some(item=>item.n===legNumber))return;
      const stats={
        played:true,
        goals:Number(leg.goals!==undefined?leg.goals:leg.g)||0,
        assists:Number(leg.assists!==undefined?leg.assists:leg.a)||0,
        saves:Number(leg.saves!==undefined?leg.saves:leg.s)||0,
        tackles:Number(leg.tackles!==undefined?leg.tackles:leg.t)||0
      };
      row.legStats[legNumber]=stats;
      row.legsPlayed++;
      row.goals+=stats.goals;
      row.assists+=stats.assists;
      row.saves+=stats.saves;
      row.tackles+=stats.tackles;
    });
    if(row.legsPlayed)rows.push(row);
  });
  return rows;
}

function awardRouteForKey(key){
  return key==='ballon'?'awards/ballon-dor':'awards/'+encodeURIComponent(String(key||''));
}
async function shareAwardTop5(key){
  const awardUrl=location.origin+location.pathname+'#/'+awardRouteForKey(key);
  const awardName=key==='ballon'?"Ballon d'Or":((buildAwards().teamAwards.concat(buildAwards().playerAwards).find(item=>item.key===key)||{}).title||'Award');
  const shareText='# '+String(app.state.leagueName||'UEL')+' ('+String(app.state.seasonName||'Season')+') ['+awardName+']('+awardUrl+')';
  const target=document.getElementById('award-share-capture');
  if(!target)return toast('Award preview not found','err');
  if(typeof window.html2canvas!=='function')return toast('Screenshot tool is still loading. Try again in a moment.','err');
  try{
    const canvas=await window.html2canvas(target,{
      backgroundColor:'#0b0d17',
      scale:Math.min(2,window.devicePixelRatio||2),
      useCORS:true,
      allowTaint:false,
      logging:false,
      ignoreElements:element=>element.hasAttribute&&element.hasAttribute('data-html2canvas-ignore')
    });
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)throw new Error('Could not create screenshot');
    const file=new File([blob],String(key)+'-top-5.png',{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:awardName+' · TOP 5',text:shareText});
        return;
      }catch(error){
        if(error&&error.name==='AbortError')return;
      }
    }
    const downloadUrl=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=downloadUrl;
    link.download=String(key)+'-top-5.png';
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(downloadUrl),1500);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(shareText);
      toast('Screenshot downloaded · award link copied','ok');
    }else{
      trackCopyFallback(shareText,()=>toast('Screenshot downloaded · copy the award link','ok'));
    }
  }catch(error){
    console.error('Award screenshot share failed:',error);
    toast('Could not create the screenshot. Please try again.','err');
  }
}

function teamOfTheSeason(){
  const st = computePlayerStats();
  const pool = app.state.players.map(p => ({ p, s: st[p.id] || {} }));
  const pick = keys => {
    let best = null;
    pool.forEach(x => {
      if (!best){ best = x; return; }
      for (let i = 0; i < keys.length; i++){
        const d = (+x.s[keys[i]] || 0) - (+best.s[keys[i]] || 0);
        if (d > 0){ best = x; return; }
        if (d < 0) return;
      }
    });
    return (best && (+best.s[keys[0]] || 0) > 0) ? best : null;
  };
  return [
    { slot:'ST',  icon:'⚽', role:'Striker',    key:'goals',   unit:'Goals',   row: pick(['goals','assists','tackles','saves']) },
    { slot:'CAM', icon:'🎯', role:'Playmaker',  key:'assists', unit:'Assists', row: pick(['assists','goals','tackles','saves']) },
    { slot:'CB',  icon:'🛡️', role:'Defender',   key:'tackles', unit:'Tackles', row: pick(['tackles','saves','goals','assists']) },
    { slot:'GK',  icon:'🧤', role:'Goalkeeper', key:'saves',   unit:'Saves',   row: pick(['saves','tackles','goals','assists']) }
  ];
}

const ROUTE_PATHS = {registry:'registry',teams:'teams',players:'players',standings:'standings',fixtures:'fixtures',awards:'awards',archive:'archive',matchcenter:'matchcenter',results:'results',tournament:'tournament',guide:'guide',logs:'logs'};
function routeSlug(value){
  return String(value||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function routeForCurrentView(view){
  if(view==='teamprofile'){const t=teamById(app._teamViewId);return 'teams/'+(t?routeSlug(t.name):encodeURIComponent(app._teamViewId||''));}
  if(view==='playerprofile'){const p=playerById(app._playerViewId);return 'players/'+(p?routeSlug(p.name):encodeURIComponent(app._playerViewId||''));}
  if(view==='ballonDor')return 'awards/ballon-dor';
  if(view==='awarddetail')return awardRouteForKey(app._awardViewKey);
  if(view==='archive'&&app._archiveViewId)return 'archive/'+encodeURIComponent(app._archiveViewId);
  if(view==='matchdetail'&&app._matchViewId)return 'matchdetail/'+encodeURIComponent(app._matchViewId)+(app._matchTab==='lineups'?'/lineups':'');
  return ROUTE_PATHS[view]||'registry';
}
function resolveBySlug(items,slug){
  const decoded=decodeURIComponent(slug||'');
  return items.find(x=>x.id===decoded)||items.find(x=>routeSlug(x.name)===decoded.toLowerCase())||null;
}
function applyHashRoute(){
  const currentHash=location.hash||'#/registry';
  const raw=currentHash.startsWith('#/')?currentHash.slice(2):currentHash.replace(/^#/,'');
  const parts=raw.split('/').filter(Boolean), first=parts[0]||'registry';
  app._teamViewId=null;app._playerViewId=null;app._archiveViewId=null;app._awardViewKey=null;
  app._matchViewId=null;app._matchTab='overview';
  if(first==='teams'&&parts[1]){
    const t=resolveBySlug(app.state.teams,parts.slice(1).join('/'));app.currentView=t?'teamprofile':'teams';app._teamViewId=t?t.id:null;
  }else if(first==='players'&&parts[1]){
    const p=resolveBySlug(app.state.players,parts.slice(1).join('/'));app.currentView=p?'playerprofile':'players';app._playerViewId=p?p.id:null;
  }else if(first==='awards'&&parts[1]){
    const awardSlug=decodeURIComponent(parts.slice(1).join('/'));
    if(awardSlug==='ballon-dor'||awardSlug==='ballon')app.currentView='ballonDor';
    else{
      const awardData=buildAwards();
      const available=awardData.teamAwards.concat(awardData.playerAwards).some(item=>item.key===awardSlug);
      app.currentView=available?'awarddetail':'awards';
      app._awardViewKey=available?awardSlug:null;
    }
  }
  else if(first==='archive'&&parts[1]){app.currentView='archive';app._archiveViewId=decodeURIComponent(parts[1]);}
  else if(first==='matchdetail'&&parts[1]){
    const matchId=decodeURIComponent(parts[1]);
    const validMatch=app.state.matches.some(match=>match.id===matchId);
    const validFixture=app.state.fixtures.some(fixture=>fixture.id===matchId);
    if(validMatch||validFixture){
      app.currentView='matchdetail';app._matchViewId=matchId;
      app._matchTab=parts[2]==='lineups'?'lineups':'overview';
    }else app.currentView='fixtures';
  }
  else{const aliases={'match-center':'matchcenter'},view=aliases[first]||first;app.currentView=Object.prototype.hasOwnProperty.call(ROUTE_PATHS,view)?view:'registry';}
  render();window.scrollTo({top:0,behavior:'auto'});
}
function navigateToRoute(path){
  const cleanPath=String(path||'').charAt(0)==='/'?String(path).slice(1):String(path);
  const next='#/'+cleanPath;
  if(location.hash===next)applyHashRoute();else location.hash=next;
}
function go(view){
  if(view==='teamprofile'||view==='playerprofile'||view==='ballonDor'||view==='matchdetail'){navigateToRoute(routeForCurrentView(view));return;}
  if(view!=='tournament')app._tourViewId=null;
  if(view!=='archive')app._archiveViewId=null;
  app._teamViewId=null;app._playerViewId=null;app._matchViewId=null;app._matchTab='overview';
  navigateToRoute(routeForCurrentView(view));
}

const RP_SCORE  = /^(.+?)\s+(\d+)\s*[-–—:]\s*(\d+)\s+(.+)$/;
const RP_VS     = /^(.+?)\s+(?:vs\.?|versus|v)\s+(.+)$/i;
const RP_LEG_A  = /^(?:leg|round)\s*(\d+)\s*[:.]?\s*(?:(\d+)\s*[-–—:]\s*(\d+))?$/i;
const RP_LEG_B  = /^(\d+)(?:st|nd|rd|th)?\s*leg\s*[:.]?\s*(?:(\d+)\s*[-–—:]\s*(\d+))?$/i;
const RP_TOKENS = /^(.+?)\s+((?:\d+\s*[gast]\s*)+)$/i;
const RP_BARE   = /^(.+?)\s+(\d+)\s+(\d+)(?:\s+(\d+))?(?:\s+(\d+))?$/;
const RP_AWARD  = /^(mvp|motm)\s*:?\s*(.+)$/i;

function rpNorm(s){
  let out = String(s || '');
  if (out.normalize) out = out.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  return out.toLowerCase().replace(/[^a-z0-9\u0400-\u04FF]+/g, ' ').trim().replace(/\s+/g, ' ');
}

function rpDistance(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = [];
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    prev = cur;
  }
  return prev[n];
}

function rpScore(query, candidate){
  if (!query || !candidate) return -1;
  if (query === candidate) return 100;
  if (candidate.indexOf(query) === 0 || query.indexOf(candidate) === 0) return 80 - Math.abs(candidate.length - query.length);
  if (query.length >= 3 && candidate.indexOf(query) > -1) return 60;
  const d = rpDistance(query, candidate);
  const max = Math.max(1, Math.floor(Math.max(query.length, candidate.length) / 4));
  return d <= max ? 50 - d : -1;
}

function rpMatchPlayer(players, typed){
  const q = rpNorm(typed);
  if (!q) return null;
  let best = null, bestScore = -1, tie = false;
  players.forEach(p => {
    const keys = [rpNorm(p.name)].concat((p.aliases || []).map(rpNorm));
    keys.forEach(k => {
      const sc = rpScore(q, k);
      if (sc > bestScore){ bestScore = sc; best = p; tie = false; }
      else if (sc === bestScore && sc > 0 && p !== best){ tie = true; }
    });
  });
  return (best && bestScore > 0 && !tie) ? best : null;
}

function rpMatchTeam(name){
  const q = rpNorm(name);
  if (!q) return null;
  let best = null, bestScore = -1;
  app.state.teams.forEach(t => {
    const keys = [rpNorm(t.name)].concat((t.aliases || []).map(rpNorm));
    keys.forEach(k => {
      const sc = rpScore(q, k);
      if (sc > bestScore){ bestScore = sc; best = t; }
    });
  });
  return bestScore > 0 ? best : null;
}

function rpFindTeam(name){ return rpMatchTeam(name); }
function rpFindPlayer(teamIds, name){
  const pool = app.state.players.filter(p => teamIds.indexOf(p.teamId) > -1);
  return rpMatchPlayer(pool, name) || rpMatchPlayer(app.state.players, name);
}

function rpNewMatch(round, aName, bName){
  return { round, teamAName: aName, teamBName: bName, legs: [], curLeg: 0, mvpName: '', motmName: '', warnings: [] };
}
function rpEnsureLeg(m, idx){
  idx = Math.max(0, Math.min(3, idx));
  while (m.legs.length <= idx) m.legs.push({ a: null, b: null, given: false, players: [] });
  m.curLeg = idx;
  return m.legs[idx];
}
function rpDeriveLeg(m, leg){
  let a = 0, b = 0;
  leg.players.forEach(p => {
    if (!p.player) return;
    if (m.teamA && p.player.teamId === m.teamA.id) a += p.goals || 0;
    else if (m.teamB && p.player.teamId === m.teamB.id) b += p.goals || 0;
  });
  leg.a = a; leg.b = b;
}
function rpDeriveAgg(m){
  m.aggA = m.legs.reduce((n, l) => n + (l.a || 0), 0);
  m.aggB = m.legs.reduce((n, l) => n + (l.b || 0), 0);
}

function parseReportText(text){
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/[*_`]/g, '').trim());
  const matches = [];
  let round = '', cur = null;

  for (const line of lines){
    if (!line) continue;

    const aw = line.match(RP_AWARD);
    if (aw && cur){
      if (aw[1].toLowerCase() === 'mvp') cur.mvpName = aw[2].trim();
      else cur.motmName = aw[2].trim();
      continue;
    }

    const lg = line.match(RP_LEG_A) || line.match(RP_LEG_B);
    if (lg && cur){
      const leg = rpEnsureLeg(cur, Number(lg[1]) - 1);
      if (lg[2] !== undefined && lg[2] !== null){
        leg.a = Number(lg[2]); leg.b = Number(lg[3]); leg.given = true;
      }
      continue;
    }

    const sc = line.match(RP_SCORE);
    if (sc){
      const aName = sc[1].trim(), bName = sc[4].trim();
      const samePair = cur && cur.legs.length === 0 &&
        rpNorm(cur.teamAName) === rpNorm(aName) && rpNorm(cur.teamBName) === rpNorm(bName);
      if (!samePair){ cur = rpNewMatch(round, aName, bName); matches.push(cur); }
      const leg = rpEnsureLeg(cur, 0);
      leg.a = Number(sc[2]); leg.b = Number(sc[3]); leg.given = true;
      continue;
    }

    const vs = line.match(RP_VS);
    if (vs){ cur = rpNewMatch(round, vs[1].trim(), vs[2].trim()); matches.push(cur); continue; }

    const tk = line.match(RP_TOKENS);
    if (tk && cur){
      const st = { name: tk[1].trim(), goals: 0, assists: 0, saves: 0, tackles: 0 };
      const re = /(\d+)\s*([gastf])/gi;
      let hit;
      while ((hit = re.exec(tk[2]))){
        const v = Number(hit[1]); const k = hit[2].toLowerCase();
        if (k === 'g') st.goals += v; else if (k === 'a') st.assists += v;
        else if (k === 's') st.saves += v; else st.tackles += v;
      }
      rpEnsureLeg(cur, cur.curLeg).players.push(st);
      continue;
    }

    const br = line.match(RP_BARE);
    if (br && cur){
      rpEnsureLeg(cur, cur.curLeg).players.push({
        name: br[1].trim(), goals: Number(br[2]) || 0, assists: Number(br[3]) || 0,
        saves: Number(br[4]) || 0, tackles: Number(br[5]) || 0
      });
      continue;
    }

    if (!cur){ round = line; continue; }
    cur.warnings.push('Ignored: "' + line.slice(0, 50) + '"');
  }

  matches.forEach((m, mi) => {
    m.index = mi;
    m.teamA = rpFindTeam(m.teamAName);
    m.teamB = rpFindTeam(m.teamBName);
    if (!m.teamA) m.warnings.push('Unknown team: ' + m.teamAName);
    if (!m.teamB) m.warnings.push('Unknown team: ' + m.teamBName);
    m.teamIds = [m.teamA && m.teamA.id, m.teamB && m.teamB.id].filter(Boolean);
    if (!m.legs.length) rpEnsureLeg(m, 0);
    m.legs.forEach((leg, li) => {
      leg.index = li;
      leg.players.forEach((p, pi) => {
        p.index = pi; p.leg = li;
        if (!p.manual) p.player = rpFindPlayer(m.teamIds, p.name);
        if (!p.player) m.warnings.push('Unknown player: ' + p.name);
      });
      if (!leg.given) rpDeriveLeg(m, leg);
    });
    rpDeriveAgg(m);
    m.players = [];
    m.legs.forEach(l => l.players.forEach(p => m.players.push(p)));
  });

  return { matches };
}

function importReportMatches(parsed){
  const created = [];
  parsed.matches.forEach((pm, idx) => {
    if (!pm.teamA || !pm.teamB || pm.teamA.id === pm.teamB.id) return;
    if (!pm.legs.length) return;

    let f = app.state.fixtures.find(x => !x.played && !x.tournamentId &&
      ((x.teamAId === pm.teamA.id && x.teamBId === pm.teamB.id) ||
       (x.teamAId === pm.teamB.id && x.teamBId === pm.teamA.id)));

    if (!f){
      f = {
        id: uuid(), teamAId: pm.teamA.id, teamBId: pm.teamB.id,
        competition: 'League', round: pm.round || 'Imported',
        date: '', legs: pm.legs.length, played: false, stage: 'friendly', tournamentId: null, group: null
      };
      app.state.fixtures.push(f);
    }
    f.legs = pm.legs.length;

    const blank = () => ({ played: false, goals: 0, assists: 0, saves: 0, tackles: 0 });
    const stats = {};
    pm.legs.forEach((leg, li) => {
      leg.players.forEach(p => {
        if (!p.player) return;
        const id = p.player.id;
        if (!stats[id]) stats[id] = pm.legs.map(blank);
        const slot = stats[id][li];
        slot.played = true;
        slot.goals += p.goals || 0;
        slot.assists += p.assists || 0;
        slot.saves += p.saves || 0;
        slot.tackles += p.tackles || 0;

        const norm = rpNorm(p.name);
        const known = [rpNorm(p.player.name)].concat((p.player.aliases || []).map(rpNorm));
        if (norm && known.indexOf(norm) === -1){
          p.player.aliases = (p.player.aliases || []).filter(a => rpNorm(a) !== norm).slice(-9).concat(p.name);
        }
      });
    });

    const contrib = pid => stats[pid].reduce((n, l) => n + l.goals * 5 + l.assists * 3 + l.saves + l.tackles * 0.5, 0);
    const ranked = Object.keys(stats).map(pid => ({ pid, v: contrib(pid) })).sort((a, b) => b.v - a.v);

    const byName = name => name ? rpFindPlayer([pm.teamA.id, pm.teamB.id], name) : null;
    const mvpP = byName(pm.mvpName) || (ranked[0] && playerById(ranked[0].pid)) || null;
    const motmP = byName(pm.motmName) || (ranked[1] && playerById(ranked[1].pid)) || mvpP;

    const m = {
      id: uuid(),
      teamAId: pm.teamA.id, teamBId: pm.teamB.id, fixtureId: f.id,
      timestamp: Date.now() + idx,
      mvpId: mvpP ? mvpP.id : null, motmId: motmP ? motmP.id : null,
      mvpSnapshot: mvpP ? { name: mvpP.name, teamId: mvpP.teamId } : null,
      motmSnapshot: motmP ? { name: motmP.name, teamId: motmP.teamId } : null,
      playerStats: stats, playerTeams: {}, fouls: []
    };

    Object.keys(stats).forEach(pid => {
      const p = playerById(pid);
      if (p) m.playerTeams[pid] = p.teamId;
    });

    for (let i = 1; i <= 4; i++){
      if (i <= pm.legs.length){ m['leg' + i + 'ScoreA'] = pm.legs[i - 1].a; m['leg' + i + 'ScoreB'] = pm.legs[i - 1].b; }
      else { m['leg' + i + 'ScoreA'] = null; m['leg' + i + 'ScoreB'] = null; }
    }

    applyMatchToState(m, f);
    created.push(m);
  });
  return created;
}

function renderReportPreview(parsed){

  if (!box) return;
  const text = ($('#reportText') || {}).value || '';
  if (!parsed || app._reportText !== text){ parsed = parseReportText(text); app._reportText = text; }
  app._report = parsed;

  if (!parsed.matches.length){ box.innerHTML = `<div class="empty" style="padding:14px">Nothing recognised yet.</div>`; return; }

  let h = `<div class="tiny muted" style="margin-bottom:8px">${parsed.matches.length} match${parsed.matches.length === 1 ? '' : 'es'} recognised</div>`;

  parsed.matches.forEach(m => {
    const tA = m.teamA ? esc(m.teamA.name) : `<span style="color:var(--red)">${esc(m.teamAName)}?</span>`;
    const tB = m.teamB ? esc(m.teamB.name) : `<span style="color:var(--red)">${esc(m.teamBName)}?</span>`;
    const missing = m.players.filter(p => !p.player).length;
    const pool = app.state.players.filter(x => m.teamIds.indexOf(x.teamId) > -1);

    h += `<div class="rp-match">
      <div class="between">
        <b>${tA} <span style="color:var(--cyan)">${m.aggA} - ${m.aggB}</span> ${tB}</b>

      </div>`;
    m.legs.forEach(leg => {
      const miss = leg.players.filter(p => !p.player);
      h += `<div style="margin-top:8px">
        <div class="tiny" style="color:var(--gold);letter-spacing:1.2px">LEG ${leg.index + 1} <span style="color:var(--cyan)">${leg.a} - ${leg.b}</span></div>
        ${leg.players.filter(p => p.player).length ? `<div class="row" style="gap:5px;margin-top:5px">${leg.players.filter(p => p.player).map(p => {
          const differs = rpNorm(p.player.name) !== rpNorm(p.name);
          return `<span class="pill cy" title="${esc(p.player.name)}">${esc(p.name)}${differs ? ' → ' + esc(p.player.name) : ''} ${p.goals}G ${p.assists}A ${p.saves}S ${p.tackles}T</span>`;
        }).join('')}</div>` : ''}
        ${miss.length ? `<div style="margin-top:5px">${miss.map(p => `
          <div class="row" style="gap:6px;margin-top:4px">
            <span class="pill go">${esc(p.name)}</span>
            <span class="tiny muted">not found, pick:</span>
            <select data-rp-fix="${m.index}:${leg.index}:${p.index}" style="width:auto;flex:1;max-width:240px;padding:4px 6px;font-size:11px">
              <option value="">skip this player</option>
              ${pool.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
            </select>
          </div>`).join('')}</div>` : ''}
      </div>`;

    h += `${m.warnings.length ? `<div class="tiny" style="color:var(--gold);margin-top:7px">${m.warnings.map(esc).join(' • ')}</div>` : ''}</div>`;
  });

  box.innerHTML = h;
